services:
  db:
    image: postgis/postgis:16-3.4
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Localhost-only: only Django/Celery talk to Postgres, over the
      # internal Docker network — this host mapping is just for optionally
      # pointing a local DB GUI at it from the Mac itself. Never needed by a
      # phone/mobile app, so it must not be LAN-reachable.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Localhost-only — same reasoning as Postgres above: internal-only,
      # never touched by a phone/mobile app directly.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    ports:
      # 9000 (S3 API) stays LAN-accessible on purpose: AWS_S3_PUBLIC_ENDPOINT_URL
      # points the phone directly at this host:port for signed image URLs
      # (profile photos, ID docs, job photos) — binding it to localhost would
      # silently break every image rendered on a physical device.
      - "9000:9000"
      # 9001 is the MinIO web admin console — a browser-only tool, never used
      # by either mobile app, so it's localhost-only.
      - "127.0.0.1:9001:9001"

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      until mc alias set localminio http://minio:9000 $${AWS_ACCESS_KEY_ID} $${AWS_SECRET_ACCESS_KEY}; do sleep 1; done;
      mc mb -p localminio/$${AWS_STORAGE_BUCKET_NAME};
      exit 0;
      "

  backend:
    build:
      context: ./backend
    command: web
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
    command: celery
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
